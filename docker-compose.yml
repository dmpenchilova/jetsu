# Локальный запуск всего сайта одной командой: docker compose up -d --build
#   админка        http://localhost:3001/admin
#   сайт           http://localhost:3000
#   тестовая почта http://localhost:8025 (сюда приходят письма о заявках)
# Фронт берётся из папки рядом (../jet-front-main), путь можно поменять в .env: FRONT_DIR=...
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jet
      POSTGRES_PASSWORD: jet
      POSTGRES_DB: jet_admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jet -d jet_admin']
      interval: 3s
      retries: 20

  admin:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jet:jet@db:5432/jet_admin
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Задайте PAYLOAD_SECRET в .env}
      SERVER_URL: http://localhost:3001
      # фронт внутри docker-сети — для сброса кэша; в браузере превью открывается по FRONT_PUBLIC_URL
      FRONT_URL: http://localhost:3000
      FRONT_INTERNAL_URL: http://front:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-secret}
      # письма о заявках; локально — в тестовый ящик Mailpit
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@jet.su}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      PRIVATE_UPLOADS_DIR: /app/private-uploads
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - media:/app/media
      - private_uploads:/app/private-uploads

  # Тестовый почтовый ящик: все письма остаются здесь и никуда не уходят
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'

  # Служебный контейнер для команд: docker compose run --rm tools npm run import:fixtures
  tools:
    build:
      context: .
      target: builder
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jet:jet@db:5432/jet_admin
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      SERVER_URL: http://localhost:3001
      MEDIA_DIR: /app/media
      PRIVATE_UPLOADS_DIR: /app/private-uploads
      FRONT_DIR: /front
      PAYLOAD_JOBS_AUTORUN: 'false'
    volumes:
      - media:/app/media
      - private_uploads:/app/private-uploads
      - ${FRONT_DIR:-../jet-front-main}:/front:ro

  front:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on: [admin]
    # Внутри контейнера localhost:3001 перенаправляется в админку, поэтому адреса картинок
    # и API одинаковы для браузера и для сервера фронта.
    # Сборка фронта при первом запуске занимает несколько минут.
    command: >-
      sh -c "node -e \"const n=require('net');n.createServer(c=>{const s=n.connect(3001,'admin');c.pipe(s).pipe(c);c.on('error',()=>s.destroy());s.on('error',()=>c.destroy())}).listen(3001,'127.0.0.1')\" &
      npm ci && npm run build && npm run start -- -p 3000"
    environment:
      SITE: localhost:3000
      API: localhost:3001
      IS_HTTPS: 'false'
      IS_DEVELOPMENT: 'false'
      DISABLE_CACHE: 'false'
      # ключ SmartCaptcha для сайта; пусто — капча выключена (локально)
      RECAPTCHA_SITE_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-secret}
      ADMIN_URL: http://localhost:3001
      # git-хуки фронта в контейнере не нужны
      HUSKY: '0'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${FRONT_DIR:-../jet-front-main}:/app
      - front_modules:/app/node_modules
      - front_next:/app/.next

volumes:
  pgdata:
  media:
  private_uploads:
  front_modules:
  front_next:
