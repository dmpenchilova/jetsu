# Боевой сервер: сайт + админка + база + HTTPS (Caddy) + ежедневные резервные копии.
# Запуск (из папки deploy):  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Подробно — deploy/README.md
# Тестовый стенд — та же схема со своим .env (STAND_NAME=test, другие домены), см. README «Стенды».
name: ${COMPOSE_PROJECT_NAME:-jetsu}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:-jet_admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-jet} -d ${DB_NAME:-jet_admin}']
      interval: 5s
      retries: 20
    # наружу база не открыта

  admin:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-jet}:${DB_PASSWORD}@db:5432/${DB_NAME:-jet_admin}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Задайте PAYLOAD_SECRET в .env}
      SERVER_URL: https://${ADMIN_DOMAIN}
      FRONT_URL: https://${SITE_DOMAIN}
      FRONT_INTERNAL_URL: http://front:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Задайте REVALIDATE_SECRET в .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@jet.su}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      # стенд: prod — боевой; test/dev — не индексируется, письма только на STAND_EMAIL_TO, метка в админке
      STAND_NAME: ${STAND_NAME:-prod}
      STAND_EMAIL_TO: ${STAND_EMAIL_TO:-}
      # оповещения о сбоях
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # вход: обязательная 2FA для ролей и корпоративный SSO (OpenID Connect)
      TWO_FACTOR_REQUIRED_ROLES: ${TWO_FACTOR_REQUIRED_ROLES:-}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_LABEL: ${SSO_LABEL:-}
      SSO_ALLOWED_DOMAINS: ${SSO_ALLOWED_DOMAINS:-}
      SSO_AUTO_CREATE_ROLE: ${SSO_AUTO_CREATE_ROLE:-}
    volumes:
      - media:/app/media
      - private_uploads:/app/private-uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/cms-api/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  front:
    build:
      context: ${FRONT_DIR:-../../jet-front-main}
      dockerfile: ${PWD}/front.Dockerfile
      args:
        API: ${ADMIN_DOMAIN}
        SITE: ${SITE_DOMAIN}
        MAIN_URL: https://${SITE_DOMAIN}
        IS_HTTPS: 'true'
        RECAPTCHA_SITE_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
    restart: unless-stopped
    depends_on: [admin]
    environment:
      API: ${ADMIN_DOMAIN}
      SITE: ${SITE_DOMAIN}
      IS_HTTPS: 'true'
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      ADMIN_URL: https://${ADMIN_DOMAIN}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  # HTTPS-сертификаты Let's Encrypt, заголовки безопасности, доступ к админке только из разрешённых сетей
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [admin, front]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-0.0.0.0/0 ::/0}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Резервные копии: каждую ночь база + файлы, хранятся BACKUP_KEEP_DAYS дней
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-jet}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-jet_admin}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: Europe/Moscow
      STAND_NAME: ${STAND_NAME:-prod}
      # копия в облако (S3-совместимое хранилище); пусто — только на сервере
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_KEEP_DAYS: ${S3_KEEP_DAYS:-90}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/data/media:ro
      - private_uploads:/data/private-uploads:ro
    entrypoint: ['sh', '/backup.sh']

  # Мониторинг доступности (Uptime Kuma): включается профилем
  #   docker compose -f docker-compose.prod.yml --env-file .env --profile monitoring up -d
  # Интерфейс — только с сервера: ssh -L 3002:127.0.0.1:3002 <сервер>, затем http://localhost:3002
  uptime:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ['monitoring']
    ports:
      - '127.0.0.1:3002:3001'
    volumes:
      - uptime_data:/app/data

volumes:
  pgdata:
  media:
  private_uploads:
  caddy_data:
  caddy_config:
  uptime_data:
